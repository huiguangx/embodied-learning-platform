services:
  api:
    build: ./backend
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      APP_ENV: development
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  frontend:
    build: ./frontend
    working_dir: /app
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  frontend-node-modules:
